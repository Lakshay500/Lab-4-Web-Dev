<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Secure Connect - Chat Test Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 280px; overflow-y: auto; padding: .5rem; margin: .5rem 0; background: #fafafa; }
    input { padding: .4rem; } .row { display: flex; gap: .5rem; margin-bottom: .5rem; } .row input { flex: 1; }
    .note { color: #777; font-style: italic; }
  </style>
</head>
<body>
  <h2>Secure Connect Chat</h2>
  <p>Log in with Postman (<code>POST /api/auth/login</code>), paste the token, then connect.</p>
  <div class="row"><input id="token" type="password" aria-label="JWT access token" autocomplete="off" /><button id="connect">Connect</button></div>
  <div class="row"><input id="room" value="general" /><button id="join">Join room</button></div>
  <div id="log"></div>
  <div class="row"><input id="text" aria-label="Message" autocomplete="off" /><button id="send">Send</button></div>
  <div id="typing" class="note"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    const $ = (id) => document.getElementById(id);
    const log = (t, cls) => {
      const d = document.createElement('div');
      d.textContent = t; if (cls) d.className = cls;
      $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
    };

    $('connect').onclick = () => {
      socket = io({ auth: { token: $('token').value.trim() } });
      socket.on('connect', () => log('Connected as ' + socket.id, 'note'));
      socket.on('connect_error', (e) => log('Connection refused: ' + e.message, 'note'));
      socket.on('room:joined', (d) => log('Joined #' + d.room, 'note'));
      socket.on('room:notice', (d) => log('[' + d.room + '] ' + d.text, 'note'));
      socket.on('chat:error', (d) => log('Error: ' + d.message, 'note'));
      socket.on('chat:message', (m) => log('[' + m.room + '] ' + m.username + ': ' + m.text));
      let t; socket.on('chat:typing', (d) => {
        $('typing').textContent = d.username + ' is typing...';
        clearTimeout(t); t = setTimeout(() => ($('typing').textContent = ''), 1500);
      });
    };
    $('join').onclick = () => socket && socket.emit('room:join', { room: $('room').value });
    const send = () => {
      if (!socket) return;
      socket.emit('chat:message', { room: $('room').value, text: $('text').value }, (r) => {
        if (!r.ok) log('Not sent: ' + r.error, 'note');
      });
      $('text').value = '';
    };
    $('send').onclick = send;
    $('text').onkeydown = (e) => { if (e.key === 'Enter') send(); else socket && socket.emit('chat:typing', { room: $('room').value }); };
  </script>
</body>
</html>
